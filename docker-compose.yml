services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: immersyte
      POSTGRES_PASSWORD: immersyte
      POSTGRES_DB: immersyte
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immersyte"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://immersyte:immersyte@postgres:5432/immersyte
      JWT_SECRET: dev-secret-change-me
      PUBLIC_QUIZ_BASE_URL: http://localhost:15173
      CORS_ORIGINS: http://localhost:15173
      SUPER_ADMIN_EMAIL: florian@immersyte.com
      SUPER_ADMIN_PASSWORD: ChangeMe123!
      SUPER_ADMIN_NAME: Florian
      PORT: "8000"
    ports:
      - "18000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:18000
    ports:
      - "15173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
